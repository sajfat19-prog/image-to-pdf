<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تحسين الصور و PDF — AI</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-medium@latest/dist/umd/2x.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upscaler@latest/dist/browser/umd/upscaler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;background:#f4f6f8;color:#17202a}
.wrap{max-width:980px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 22px #0000000d}
h1{margin:0 0 7px;font-size:24px}.sub{color:#667085;font-size:14px}
.drop{border:2px dashed #98a2b3;border-radius:16px;padding:28px;text-align:center;cursor:pointer;background:#fafafa}
.drop.drag{border-color:#2563eb;background:#eff6ff}.drop strong{display:block;font-size:18px;margin-bottom:6px}
input[type=file]{display:none}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select{border:0;border-radius:12px;padding:11px 15px;font-size:15px}button{background:#111827;color:#fff;cursor:pointer}button.secondary{background:#e9eef5;color:#111827}button:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.item{border:1px solid #e4e7ec;border-radius:14px;overflow:hidden;background:#fff}.item img{width:100%;height:210px;object-fit:contain;background:#f2f4f7}.meta{padding:10px;font-size:13px}.status{font-weight:700;margin-top:5px}.bar{height:7px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:#2563eb;transition:width .2s}
.note{font-size:13px;line-height:1.7;color:#475467}.good{color:#067647}.warn{color:#b54708}.err{color:#b42318}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.controls label{font-size:13px;color:#475467}.controls select{width:100%;background:#f2f4f7;margin-top:5px}
@media(max-width:600px){.wrap{padding:10px}.card{padding:14px}.item img{height:170px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>تحسين الصور بالذكاء الاصطناعي + PDF</h1>
<div class="sub">معالجة حقيقية داخل المتصفح، مع وضع آمن للهاتف لتقليل استهلاك الذاكرة.</div>
</div>

<div class="card">
<label class="drop" id="drop">
<strong>اضغط هنا لاختيار الصور</strong>
<span>أو اسحب الصور إلى هذه المنطقة</span>
<input id="files" type="file" accept="image/*" multiple>
</label>
</div>

<div class="card">
<div class="controls">
<label>وضع التحسين
<select id="quality">
<option value="mobile">آمن للهاتف — 2× AI</option>
<option value="quality">جودة أعلى — 2× AI</option>
</select></label>
<label>حدة النص
<select id="sharp">
<option value="light">خفيفة</option><option value="medium" selected>متوسطة</option><option value="off">بدون زيادة حدة</option>
</select></label>
<label>التباين
<select id="contrast">
<option value="off">بدون</option><option value="light" selected>خفيف</option><option value="medium">متوسط</option>
</select></label>
<label>حجم PDF
<select id="page">
<option value="a4">A4</option><option value="a5">A5</option><option value="letter">Letter</option>
</select></label>
</div>
<div class="row" style="margin-top:12px">
<button id="enhance" disabled>تحسين الصور بالـAI</button>
<button id="pdf" class="secondary" disabled>إنشاء PDF</button>
<button id="clear" class="secondary">مسح الكل</button>
</div>
<p class="note" id="engine">جاري تجهيز محرك الذكاء الاصطناعي…</p>
</div>

<div class="card"><div id="list" class="grid"></div></div>
</div>

<script>
const filesEl=document.getElementById('files'), drop=document.getElementById('drop');
const list=document.getElementById('list'), enhanceBtn=document.getElementById('enhance'), pdfBtn=document.getElementById('pdf');
const engine=document.getElementById('engine');
let items=[], busy=false, upscaler=null;

function sleep(){return new Promise(r=>setTimeout(r,20))}
function setEngine(t,cls=''){engine.className='note '+cls;engine.textContent=t}

async function initAI(){
  try{
    await tf.ready();
    let backend='cpu';
    try{await tf.setBackend('webgl'); await tf.ready(); backend=tf.getBackend()}catch(e){}
    upscaler=new Upscaler({model:ESRGANMedium2x, warmup:true});
    setEngine(`محرك AI جاهز — ${backend.toUpperCase()} — ESRGAN Medium 2×`);
  }catch(e){setEngine('تعذر تشغيل محرك AI. سيظهر الخطأ عند التحسين.','err');console.error(e)}
}
initAI();

function addFiles(fs){
  for(const f of fs){
    if(!f.type.startsWith('image/')) continue;
    const url=URL.createObjectURL(f);
    items.push({file:f,url,enhanced:null,status:'جاهز',progress:0});
  }
  render(); updateButtons();
}
filesEl.onchange=e=>addFiles([...e.target.files]); drop.onclick=()=>filesEl.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};
drop.ondragleave=()=>drop.classList.remove('drag');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');addFiles([...e.dataTransfer.files])};

function render(){
  list.innerHTML='';
  items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<img src="${it.enhanced||it.url}" id="im${i}"><div class="meta">
      <div>${escapeHtml(it.file.name)}</div>
      <div class="status" id="st${i}">${it.status}</div>
      <div class="bar"><i id="pr${i}" style="width:${it.progress}%"></i></div>
    </div>`;
    list.appendChild(d);
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function updateButtons(){enhanceBtn.disabled=!items.length||busy;pdfBtn.disabled=!items.some(x=>x.enhanced)}
function setStatus(i,s,p){items[i].status=s;items[i].progress=p;const a=document.getElementById('st'+i),b=document.getElementById('pr'+i);if(a)a.textContent=s;if(b)b.style.width=p+'%'}

function loadImage(url){
 return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});
}

async function canvasToDataURL(source, sharp, contrast){
 const im=typeof source==='string'?await loadImage(source):source;
 const maxSide=quality.value==='mobile'?2200:3000;
 const scale=Math.min(1,maxSide/Math.max(im.naturalWidth||im.width,im.naturalHeight||im.height));
 const w=Math.max(1,Math.round((im.naturalWidth||im.width)*scale)),h=Math.max(1,Math.round((im.naturalHeight||im.height)*scale));
 const c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);
 if(contrast!=='off'||sharp!=='off'){
   const img=x.getImageData(0,0,w,h),d=img.data;
   const cf=contrast==='medium'?1.10:1.04;
   for(let p=0;p<d.length;p+=4){
     d[p]=Math.max(0,Math.min(255,(d[p]-128)*cf+128));
     d[p+1]=Math.max(0,Math.min(255,(d[p+1]-128)*cf+128));
     d[p+2]=Math.max(0,Math.min(255,(d[p+2]-128)*cf+128));
   }
   x.putImageData(img,0,0);
   if(sharp!=='off'){
     const k=sharp==='medium'?0.16:0.09;
     x.globalAlpha=k;x.drawImage(c,0,1);x.drawImage(c,0,-1);x.globalAlpha=1;
   }
 }
 return c.toDataURL('image/jpeg',0.94);
}

async function enhanceOne(i){
 const it=items[i];
 setStatus(i,'تحضير الصورة…',5); await sleep();
 // The AI model is real ESRGAN 2x. UpscalerJS handles tiled prediction internally.
 const source=it.url;
 setStatus(i,'تشغيل AI…',15);
 const result=await upscaler.upscale(source,{
   patchSize: quality.value==='mobile'?128:192,
   padding:12,
   progress: p=>setStatus(i,`AI ${Math.round(15+p*70)}%`,15+p*70)
 });
 setStatus(i,'تحسين الحدة والتباين…',90); await sleep();
 const final=await canvasToDataURL(result,sharp.value,contrast.value);
 it.enhanced=final;setStatus(i,'تم التحسين الحقيقي ✓',100);
 const img=document.getElementById('im'+i);if(img)img.src=final;
}

enhanceBtn.onclick=async()=>{
 if(busy||!items.length)return; busy=true;updateButtons();
 setEngine('جاري معالجة صورة واحدة في كل مرة لتجنب ثقل الهاتف…','warn');
 for(let i=0;i<items.length;i++){
   try{await enhanceOne(i)}catch(e){console.error(e);setStatus(i,'فشل التحسين — احتفظنا بالأصل',0)}
   await sleep();
 }
 busy=false;updateButtons();setEngine('اكتملت المعالجة. الصور المحسنة أصبحت جاهزة للـPDF.','good');
};

pdfBtn.onclick=async()=>{
 const {jsPDF}=window.jspdf;
 const size=page.value==='a5'?'a5':page.value==='letter'?'letter':'a4';
 const doc=new jsPDF({orientation:'p',unit:'mm',format:size,compress:true});
 const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight(),m=7;
 let first=true;
 for(const it of items.filter(x=>x.enhanced)){
   if(!first)doc.addPage();first=false;
   const im=await loadImage(it.enhanced);
   const r=Math.min((pw-2*m)/im.width,(ph-2*m)/im.height);
   const w=im.width*r,h=im.height*r;
   doc.addImage(it.enhanced,'JPEG',(pw-w)/2,(ph-h)/2,w,h,undefined,'FAST');
 }
 doc.save('ملزمة-محسنة-AI.pdf');
};

document.getElementById('clear').onclick=()=>{items=[];list.innerHTML='';updateButtons();setEngine('تم المسح.')};
</script>
</body></html>
