<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محول الصور إلى PDF</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6f9;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#171d2d,#39476b);color:#fff;border-radius:22px;padding:28px;margin-bottom:20px;box-shadow:0 12px 35px #0002}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:#dce3f3}.panel{background:#fff;border-radius:20px;padding:20px;box-shadow:0 6px 25px #0000000d;margin-bottom:18px}.upload{border:2px dashed #9ba7bc;border-radius:18px;padding:32px;text-align:center;cursor:pointer;background:#fafbfe}.upload:hover{border-color:#5269a3;background:#f5f7ff}.upload strong{display:block;font-size:20px;margin-bottom:8px}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:#e9edf5;color:#172033}.primary{background:#3f5fdb;color:#fff}.danger{background:#ffe8e8;color:#b42318}.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.field label{display:block;font-weight:700;margin-bottom:7px}.field select,.field input{width:100%;padding:11px;border:1px solid #d4dae5;border-radius:10px;background:#fff}.count{font-weight:700;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.card{background:#fff;border:1px solid #e0e4ec;border-radius:15px;overflow:hidden;position:relative}.thumb{aspect-ratio:3/4;background:#eef1f6;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:contain}.meta{padding:9px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.num{position:absolute;top:7px;right:7px;background:#172033;color:#fff;border-radius:9px;padding:4px 7px;font-size:12px}.remove{position:absolute;top:7px;left:7px;width:28px;height:28px;border:0;border-radius:50%;background:#fff;color:#c62828;cursor:pointer;font-weight:900;box-shadow:0 2px 8px #0002}.hint{font-size:13px;color:#667085;margin-top:10px}.empty{text-align:center;color:#667085;padding:25px}.progress{height:8px;background:#e8ebf1;border-radius:10px;overflow:hidden;margin-top:12px;display:none}.bar{height:100%;width:0;background:#3f5fdb}.status{margin-top:10px;font-size:13px;color:#475467}.footer{text-align:center;color:#7a8495;font-size:12px;padding:10px}@media(max-width:600px){.wrap{padding:12px}.hero{padding:22px}.hero h1{font-size:23px}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><section class="hero"><h1>📄 محول الصور إلى PDF</h1><p>ارفع صفحات الملزمة، رتبها، واختر A4 ثم أنشئ ملف PDF واحد.</p></section>
<section class="panel"><div class="upload" id="drop"><strong>اسحب الصور هنا أو اضغط للاختيار</strong><span>يمكنك اختيار عشرات الصور دفعة واحدة</span><input id="files" type="file" accept="image/*" multiple hidden></div><div class="btns"><button class="btn" id="add">➕ إضافة صور</button><button class="btn" id="clear">🗑️ حذف الكل</button></div><div class="hint">يمكنك سحب البطاقات لتغيير ترتيب الصفحات.</div></section>
<section class="panel"><div class="settings"><div class="field"><label>حجم الصفحة</label><select id="size"><option value="A4">A4</option><option value="A5">A5</option><option value="Letter">Letter</option><option value="original">حجم الصورة الأصلي</option></select></div><div class="field"><label>اتجاه الصفحة</label><select id="orient"><option value="auto">تلقائي حسب الصورة</option><option value="portrait">عمودي</option><option value="landscape">أفقي</option></select></div><div class="field"><label>ملاءمة الصورة</label><select id="fit"><option value="contain">كامل الصورة بدون قص</option><option value="cover">ملء الصفحة مع قص الحواف</option></select></div><div class="field"><label>هامش الصفحة (مم)</label><input id="margin" type="number" min="0" max="30" value="0"></div></div><div class="btns"><button class="btn primary" id="make">📥 إنشاء PDF</button></div><div class="progress" id="progress"><div class="bar" id="bar"></div></div><div class="status" id="status"></div></section>
<section class="panel"><div class="count" id="count">لا توجد صور بعد</div><div class="grid" id="grid"><div class="empty">أضف الصور لتظهر هنا.</div></div></section><div class="footer">يتم إنشاء الملف داخل جهازك ولا تحتاج الصور إلى رفعها إلى خادم.</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>
const files=document.getElementById('files'),drop=document.getElementById('drop'),grid=document.getElementById('grid'),count=document.getElementById('count'),status=document.getElementById('status'),bar=document.getElementById('bar'),progress=document.getElementById('progress');let items=[];
function addFiles(list){[...list].filter(f=>f.type.startsWith('image/')).forEach(f=>items.push({file:f,url:URL.createObjectURL(f)}));render()}
drop.onclick=()=>files.click();document.getElementById('add').onclick=()=>files.click();files.onchange=e=>{addFiles(e.target.files);files.value=''};
['dragover','dragenter'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.style.borderColor='#3f5fdb'}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.style.borderColor='#9ba7bc'}));drop.ondrop=e=>addFiles(e.dataTransfer.files);
document.getElementById('clear').onclick=()=>{items.forEach(x=>URL.revokeObjectURL(x.url));items=[];render()};
function render(){count.textContent=items.length?`عدد الصفحات: ${items.length}`:'لا توجد صور بعد';grid.innerHTML='';if(!items.length){grid.innerHTML='<div class="empty">أضف الصور لتظهر هنا.</div>';return}items.forEach((it,i)=>{let c=document.createElement('div');c.className='card';c.draggable=true;c.dataset.i=i;c.innerHTML=`<span class="num">${i+1}</span><button class="remove">×</button><div class="thumb"><img src="${it.url}"></div><div class="meta">${it.file.name}</div>`;c.querySelector('.remove').onclick=()=>{URL.revokeObjectURL(it.url);items.splice(i,1);render()};c.ondragstart=e=>e.dataTransfer.setData('text/plain',i);c.ondragover=e=>e.preventDefault();c.ondrop=e=>{e.preventDefault();let from=+e.dataTransfer.getData('text/plain'),to=i;if(from===to)return;let a=items.splice(from,1)[0];items.splice(to,0,a);render()};grid.appendChild(c)})}
function loadImg(it){return new Promise((res,rej)=>{let im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=it.url})}
function mmToPt(mm){return mm*72/25.4}
async function makePDF(){if(!items.length){alert('أضف صورًا أولاً');return}if(!window.jspdf){alert('تعذر تحميل محرك PDF. افتح الموقع مع اتصال بالإنترنت أول مرة.');return}progress.style.display='block';bar.style.width='0';status.textContent='جاري تجهيز الصفحات...';const {jsPDF}=window.jspdf;let first=await loadImg(items[0]);let size=document.getElementById('size').value, ori=document.getElementById('orient').value;let w,h;if(size==='A4'){w=210;h=297}else if(size==='A5'){w=148;h=210}else if(size==='Letter'){w=215.9;h=279.4}else{w=first.naturalWidth;h=first.naturalHeight;ori='portrait'}if(ori==='landscape' || (ori==='auto'&&first.naturalWidth>first.naturalHeight)){[w,h]=[h,w]}let pdf=new jsPDF({orientation:w>h?'landscape':'portrait',unit:'mm',format:[w,h],compress:true});for(let i=0;i<items.length;i++){if(i>0){let im=await loadImg(items[i]);let pw=w,ph=h;if(ori==='auto'){let iw=im.naturalWidth,ih=im.naturalHeight;if(iw>ih){pw=h;ph=w}else{pw=w;ph=h}if(pw!==w||ph!==h)pdf.addPage([pw,ph],pw>ph?'landscape':'portrait')}else pdf.addPage([w,h],w>h?'landscape':'portrait')}let im=i===0?first:await loadImg(items[i]);let pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=+document.getElementById('margin').value||0;let aw=pw-2*m,ah=ph-2*m,iw=im.naturalWidth,ih=im.naturalHeight;let s=document.getElementById('fit').value==='cover'?Math.max(aw/iw,ah/ih):Math.min(aw/iw,ah/ih);let dw=iw*s,dh=ih*s,x=(pw-dw)/2,y=(ph-dh)/2;pdf.addImage(im,'JPEG',x,y,dw,dh,undefined,'FAST');bar.style.width=((i+1)/items.length*100)+'%';status.textContent=`تم تجهيز ${i+1} من ${items.length} صفحة`;}pdf.save('ملزمة.pdf');status.textContent='تم إنشاء ملف PDF بنجاح ✅'}document.getElementById('make').onclick=makePDF;render();
</script></body></html>
